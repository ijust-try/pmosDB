name: Weekly data sync

# Every Wednesday 18:00 IST (IST = UTC+5:30, so 12:30 UTC). GitHub cron is UTC-only.
# Keep this in step with SCHEDULE in sync/run_sync.py (shown on the Data sources page).
on:
  schedule:
    - cron: "30 12 * * 3"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-harvest every source even if no new upstream release was found"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check upstream releases and re-harvest if needed
        run: python sync/run_sync.py ${{ inputs.force && '--force' || '' }}

      # A push to the default branch triggers the Vercel deployment, which publishes the new data.
      - name: Commit refreshed data
        run: |
          git config user.name "pmos-sync[bot]"
          git config user.email "pmos-sync@users.noreply.github.com"
          git add -A data pmos_knowledge_base.db seed_entities.csv unresolved_mappings.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly data sync $(date -u +%Y-%m-%d)"
            git push
          fi
